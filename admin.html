<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Physics Pathshala Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-[#0B192C] text-white p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Physics Pathshala - Client Leads Panel</h1>
                <p class="text-xs text-gray-300">Students who filled the admission enquiry form</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="/" class="bg-[#FF6500] hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Website</a>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Logout</button>
            </div>
        </div>
        <div class="p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b text-gray-700 text-sm">
                            <th class="p-4">ID</th>
                            <th class="p-4">Student Name</th>
                            <th class="p-4">Phone Number</th>
                            <th class="p-4">Selected Course</th>
                            <th class="p-4">Enquiry Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTable" class="text-sm text-gray-600">
                        <tr>
                            <td colspan="5" class="text-center p-6 text-gray-400">Loading student leads...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchLeads() {
            try {
                // Backend ke sahi route (/get-enquiries) ke sath matched
                const res = await fetch('/get-enquiries');
                const rows = await res.json();
                const tbody = document.getElementById('leadsTable');

                if (Array.isArray(rows) && rows.length > 0) {
                    tbody.innerHTML = '';
                    rows.forEach((lead, index) => {
                        tbody.innerHTML += `
                            <tr class="border-b hover:bg-gray-50 transition">
                                <td class="p-4 font-semibold text-gray-800">#${index + 1}</td>
                                <td class="p-4 font-medium text-gray-900">${lead.name || 'N/A'}</td>
                                <td class="p-4 text-orange-600 font-semibold"><a href="tel:${lead.phone}">${lead.phone || 'N/A'}</a></td>
                                <td class="p-4"><span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-medium">${lead.course || 'N/A'}</span></td>
                                <td class="p-4 text-xs text-gray-500">${lead.date ? new Date(lead.date).toLocaleString() : 'N/A'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-gray-400">No student enquiries found yet.</td></tr>`;
                }
            } catch (err) {
                document.getElementById('leadsTable').innerHTML = `<tr><td colspan="5" class="text-center p-6 text-red-500">Failed to load leads from database.</td></tr>`;
            }
        }

        async function logout() {
            window.location.href = '/login.html';
        }

        fetchLeads();
    </script>
</body>
</html>
